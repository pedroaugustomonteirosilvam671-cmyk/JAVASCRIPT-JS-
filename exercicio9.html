<p>Aperte <strong>F12</strong> e abra a aba <strong>Console</strong> para ver o resultado.</p>

<script>
    const notas = [4.5, 7.0, 8.5, 6.0, 9.0, 5.5, 10.0];

    const aprovadas = notas.filter(nota => nota >= 7);

    const notasComPontoExtra = notas.map(nota => nota + 1);

    console.log("Notas originais:", notas);
    console.log("Notas aprovadas (7 ou mais):", aprovadas);
    console.log("Todas as notas com +1 ponto:", notasComPontoExtra);
  </script>
